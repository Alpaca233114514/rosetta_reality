  approach_clearance_m: 0.08
  approach_tolerance_m: 0.012
  approach_orientation_tolerance_rad: 0.04
  grasp_tolerance_m: 0.008
  lift_object_height_m: 0.17
  lift_tolerance_m: 0.012
  meet_center_x_m: 0.0
  meet_center_y_m: 0.5
  preinsert_clearance_m: 0.10
  coarse_alignment_tolerance_m: 0.015
  maximum_cartesian_step_m: 0.012
  maximum_orientation_step_rad: 0.04
  maximum_grasp_drift_m: 0.045
  workspace_x_min_m: -0.45
  workspace_x_max_m: 0.45
  workspace_y_min_m: 0.20
  workspace_y_max_m: 0.80
  workspace_z_min_m: 0.0
  workspace_z_max_m: 0.50
inverse_kinematics:
  tolerance: 0.00005
  rotation_weight: 0.2
  regularization_threshold: 0.01
  regularization_strength: 0.001
  maximum_update_norm: 0.2
  maximum_steps: 50
  maximum_accepted_error: 0.001
  maximum_accepted_projected_error: 0.003
  maximum_joint_target_delta: 6.283185307179586
  joint_limit_active_set_retries: 6
acceptance:
