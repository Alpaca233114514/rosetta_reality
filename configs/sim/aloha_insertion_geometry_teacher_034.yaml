hypothesis: >-
  Athena plan 033 reached the registered final SimpleSampler handoff but failed
  closed before executing terminal control because MuJoCo 3.8.1 exposes the
  official actuator moment map in CSR storage rather than the assumed dense
  nu-by-nv array. Plan 034 changes that representation adapter only: validate
  moment_rownnz, moment_rowadr and moment_colind and read the one direct-DOF
  moment from the official sparse row. The affine force balance, accepted
  MoveIt path, teacher pose gates, Action Contract, joint margins, seeds and
  label seals remain frozen.
