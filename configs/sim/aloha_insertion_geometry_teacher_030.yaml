plan_id: m2-smolvla-aloha-geometry-teacher-030
status: diagnostic_preregistered_no_label_collection
hypothesis: >-
  Athena plan 029 passed local sidecar checks, but its remote static attempt
  exposed that MoveIt's official FixStartStatePathConstraints prefix can move a
  recovering joint slightly back toward a limit only after it is already far
  inside the tightened command set. Plan 030 changes one axis: a violating
  joint must improve monotonically until first entering the command margin, and
  after entry it may move non-monotonically only while remaining inside that
  margin. The official adapter, physical margin, tightened command margin,
  positive first-step recovery, constrained suffix, teacher logic, pose gates,
  collision resources, seeds and labels remain frozen.
