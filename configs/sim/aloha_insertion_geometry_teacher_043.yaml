hypothesis: >-
  Plan 041 showed that MoveIt 2.5.9's unseeded wall-clock subgroup restart
  loop could still fail at the third orient request under a 2.00-second budget.
  Plan 042 then stopped before execution because its first implementation
  incorrectly required each LMA subgroup solver base to be world. Plan 043
  copies the official subgroup structure, transforms each unchanged world-frame
  target with RobotState::setToIKSolverFrame, and uses a fixed-seed, fixed-count
  restart schedule around the unchanged official LMA solver. All Plan 041 pose,
  collision, margin, OMPL, controller, horizon, seed and label gates remain frozen.
