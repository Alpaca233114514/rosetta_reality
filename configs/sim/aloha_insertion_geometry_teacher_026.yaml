status: diagnostic_preregistered_no_label_collection
hypothesis: >-
  Athena plan 025 executed 21 collision-checked official RRTConnect waypoints
  before the live right_forearm_roll state exceeded its physical bound by
  0.0005873297882081907 rad. Plan 026 changes only the official planning
  constraint axis: MoveIt applies twelve native JointConstraint path
  constraints with the same 0.01-rad margin already registered for Mink, and
  independently verifies the goal, every returned trajectory waypoint, and
  the bounded execution waypoint against that margin. The Action Contract,
  MoveIt/LMA/RRTConnect, collision resources, teacher, pose gates, seeds and
  labels remain frozen.
