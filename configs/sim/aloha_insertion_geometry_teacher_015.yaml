schema_version: 1
plan_id: m2-smolvla-aloha-geometry-teacher-015
status: diagnostic_preregistered_no_label_collection
hypothesis: >-
  Plans 010--014 established that the custom dm_control active-set and weighted
  waypoint solver is not a reliable constrained-IK architecture. Replace that
  branch with the upstream Mink 1.2.0 differential IK quadratic program used by
  its ALOHA example: two full-pose FrameTasks, a low-cost PostureTask, native
  MuJoCo ConfigurationLimit and VelocityLimit inequalities, and the DAQP
  backend. This should search both arms jointly without post-hoc joint-limit
  clipping. The teacher, Action Contract, 1 mm IK gate, 3 mm projected gate,
  12 mm Cartesian step and every seed boundary remain unchanged.
