status: diagnostic_preregistered_no_label_collection
hypothesis: >-
  Athena plan 030 kept every registered physical and tightened joint-limit
  margin but failed 0/1 after 131 independent RRTConnect plans repeatedly
  discarded the remaining official trajectory and selected new redundant IK
  branches during orient. Plan 031 changes one axis: execute each accepted
  MoveIt global trajectory with the retained-reference semantics of MoveIt
  2.5.9 Hybrid Planning SimpleSampler plus ForwardTrajectory, advancing one
  waypoint only after the current joint state reaches the official 0.2 rad L1
  tolerance and replanning only on teacher phase change. OMPL RRTConnect, LMA
  IK, official start-state recovery, all safety margins, Action Contract step
  limits, teacher pose gates, seeds and label seals remain frozen.
