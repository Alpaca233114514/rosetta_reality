decision_policy:
  select_checkpoint_on: validation_only
  accept_candidate_if:
    - all_logged_losses_and_gradients_are_finite
    - checkpoint_reload_and_processor_statistics_match
    - validation_action_mae_improves_over_base
  reject_candidate_if:
    - hidden_test_boundary_is_crossed
    - resource_limit_is_violated
    - action_contract_or_normalization_identity_changes
    - validation_action_mae_does_not_improve_over_base
  extension_policy: >-
    Do not extend beyond 1000 steps automatically. First evaluate every registered
    checkpoint; a later continuation requires a new plan based on validation trends.
stop_conditions:
  - nonfinite_loss_gradient_or_action
  - out_of_memory
  - unsupported_accelerator_operation
  - checkpoint_failure
  - trackio_local_durability_failure
  - normalization_identity_mismatch
  - validation_or_hidden_test_episode_used_for_gradients
  - hidden_test_episode_materialized_or_loaded
