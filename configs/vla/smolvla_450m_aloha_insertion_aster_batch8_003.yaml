decision_policy:
  select_checkpoint_on: validation_only
  accept_candidate_if:
    - all_logged_losses_and_gradients_are_finite
    - checkpoint_reload_and_processor_statistics_match
    - validation_first_action_mae_improves_over_faust_control
    - standard_space_gripper_violation_rate_is_zero
    - measured_peak_xpu_allocation_is_within_registered_guard
  reject_candidate_if:
    - hidden_test_boundary_is_crossed
    - resource_limit_is_violated
    - optimizer_or_scheduler_contract_changes
    - temporal_loss_profile_or_normalization_changes
    - validation_first_action_mae_does_not_improve_over_faust_control
  extension_policy: >-
    Do not extend beyond 2,500 optimizer steps and do not automatically launch
    another full-dataset attempt.
risk_register:
  - >-
    First-action-only supervision removes direct losses from chunk steps 2-50.
    Full-chunk MAE may degrade; only first-action MAE and fixed-seed Gate 4 are
    acceptance-relevant.
  - >-
    Aster -002 observed first-action MAE 0.022567 but divided the selected loss
    by the upstream all-valid horizon denominator. It is preserved as
    exploratory evidence and is not a valid single-axis control comparison.
  - >-
    The sine decoder guarantees standard gripper bounds but is periodic for
    arbitrary internal values. Validation must retain internal-support
    diagnostics instead of treating bounded output as in-distribution proof.
stop_conditions:
  - nonfinite_loss_gradient_or_action
  - out_of_memory
  - peak_xpu_allocation_above_7516192768_bytes
