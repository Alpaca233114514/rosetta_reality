hypothesis: >-
  The Faust objective weights all 50 chunk timesteps uniformly while the
  registered Action Contract executes only the first predicted action before
  re-observing. Optimizing the first non-padding action with a selected-valid
  mean, while holding data, initialization, batch size, optimizer, scheduler
  and every other axis fixed, will improve validation first-action MAE and
  fixed-seed Gate 4 behavior relative to the read-only Faust control.
