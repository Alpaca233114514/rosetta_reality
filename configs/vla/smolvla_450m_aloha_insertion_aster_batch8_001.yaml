hypothesis: >-
  The Faust training objective weights all 50 chunk timesteps uniformly while the
  registered Action Contract executes only the first predicted action before
  re-observing. Training the pinned flow-matching objective with a registered
  first-action-only temporal weight profile, holding data, base checkpoint,
  batch size, optimizer, scheduler and all other axes fixed, will improve the
  deployment-aligned first-action MAE and fixed-seed Gate 4 behavior relative to
  the read-only Faust control.
