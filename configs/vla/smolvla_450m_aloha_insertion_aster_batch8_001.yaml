risk_register:
  - >-
    First-action-only weighting removes supervision from chunk steps 2-50. The
    full-chunk action MAE is expected to degrade; only the deployment-aligned
    first-action MAE and fixed-seed Gate 4 are acceptance-relevant.
  - >-
    The sine decoder guarantees standard gripper bounds but is periodic for
    arbitrary internal values. Validation must retain internal-support
    diagnostics instead of treating bounded output as proof that internal
    angles stayed in-distribution.
stop_conditions:
  - nonfinite_loss_gradient_or_action
  - out_of_memory
  - peak_xpu_allocation_above_7516192768_bytes
