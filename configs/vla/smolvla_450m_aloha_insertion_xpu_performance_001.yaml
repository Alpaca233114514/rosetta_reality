schema_version: 1
role: vla
stage: m2_xpu_training_performance
status: preregistered
plan_id: m2-smolvla450m-xpu-performance-001
hypothesis: >-
  The existing trainer is update-bound. Increasing the real batch size reduces
  the number of frozen 350M-class VLM prefix executions per dataset pass. The
  two placeholder camera image payloads are fully masked but the upstream path
  still runs the frozen vision encoder for both. The pinned checkpoint disables
  image special tokens and prefix padding, so the upstream empty_cameras=0
  option removes only those masked payloads while preserving the dataset,
  Action Contract, model revision, trainable parameter set, optimizer,
  scheduler and hidden-test boundary.
