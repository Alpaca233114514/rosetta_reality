resources:
  runtime: docker_linux_from_wsl
  accelerator: xpu
  mixed_precision: bf16
  memory_limit: 6g
  memory_swap_limit: 6g
  cpu_limit: 2
decision_policy:
  select_fastest_candidate_if:
    - fixed_forward_parity_passed_when_empty_cameras_is_zero
    - all_post_warmup_losses_gradients_and_timings_are_finite
    - peak_xpu_allocated_bytes_within_registered_limit
    - projected_one_pass_wall_seconds_at_or_below_target
  stop_candidate_if:
    - out_of_memory
    - nonfinite_loss_gradient_or_timing
    - unsupported_accelerator_or_compile_operation
    - hidden_test_episode_materialized_or_loaded
  stop_search_if: >-
    the next candidate exceeds the memory guardrail, produces non-finite values,
    or is slower after including its one-time compilation cost
reuse_boundary:
  allowed:
    - immutable_model_and_dataset_snapshots
    - train_only_normalization
    - upstream_train_expert_only_path
    - upstream_compile_model_configuration
    - upstream_empty_cameras_configuration
    - local_trackio_store
  prohibited:
    - old_qwen_feature_cache
    - hidden_test_data
    - stale_prefix_cache_after_state_projection_updates
    - activation_checkpointing_for_speed
    - unbounded_host_or_xpu_cache
