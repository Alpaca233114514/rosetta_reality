hypothesis: >-
  Aster's single seeded Gaussian sample may add enough action variance to
  compound teacher-forced error, while an all-zero flow initial state is out of
  distribution and was empirically worse. Holding the selected artifact,
  environment seeds, Gaussian distribution, action boundary, chunk execution,
  simulator, collision policy and acceptance thresholds fixed, averaging four
  independent legal Gaussian predictions in standard action space may reduce
  sampling variance without leaving the model's trained flow distribution.
