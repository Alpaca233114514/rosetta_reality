hypothesis: >-
  Vision-front-end adaptation candidate. Against the immutable Zen-uniform
  control lineage (fresh pinned base, uniform flow loss, batch 64, 316
  optimizer updates, 20,224 exposures, identical optimizer/scheduler, seed
  and split), this arm changes exactly one variable: the declared visual
  front end (vlm.model.vision_model + vlm.model.connector) joins the
  trainable set inside the trainer process while the language model, the
  saved policy flags and every other training semantic stay on the frozen
  baseline. The corrected September-5 diagnostics motivate the axis (frame-0
  image sensitivity without expert alignment; no linearly decodable object
  placement in the frozen tower/connector readouts, mean or 2x2 spatial).
  The registered smoke evidence additionally proves non-zero vision updates
  and a bit-identical language model. Acceptance is not offline MAE: the
  chain is validation-only selection, exact-reload export, the corrected
  frame-0 paired alignment probe on the exported artifact, and a separately
  registered Gate 3/4 comparison. The two declared instrumentation features
  carry no learning semantics (audit findings O2/T9 observability).
