run_name: m2-smolvla450m-formal-optimized-001
hypothesis: >-
  Starting from the immutable SmolVLA base, a measured batch-12 XPU path can expose
  the policy to at least one complete forty-episode training pass within the
  two-hour wall-time budget. The path amortizes the frozen 350M VLM prefix across
  the batch, preserves all three camera token slots while skipping encoder calls
  for two fully masked placeholders, and reuses a revision-scoped Inductor/Triton
  cache. Validation quality and closed-loop gates remain independent acceptance
  requirements.
