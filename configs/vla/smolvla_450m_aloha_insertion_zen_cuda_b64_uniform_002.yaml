  blocked Prometheus furnace could not close: at CUDA scale, batch 64, one
  registered-exposure pass (20,224 exposures, 316 optimizer steps) and fresh
  pinned-base initialization, upstream uniform flow-matching over the whole
  chunk is compared against arm B (identical identity except the preregistered
  first_action_only temporal weight profile) through validation-only selection,
  exact export/reload and closed-loop Gates 3/4. This arm changes nothing from
  the Faust-family objective; any attribution requires arm B under the other
  Zen plan frozen in the same session.
