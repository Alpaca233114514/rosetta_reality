hypothesis: >-
  The Aster trace diverged from the expert at step zero and crossed 0.025 state
  MAE by step four, while the policy action was about eight times more sensitive
  to state shuffling than image shuffling. Adding one fixed 0.05 standard
  deviation Gaussian perturbation to train-normalized state only, with the
  absolute expert action target unchanged, may teach local corrective behavior.
  This two-step smoke validates only implementation, gradients, checkpointing
  and resource safety; it does not claim closed-loop improvement.
