hypothesis: >-
  The trainer is update-bound. A larger real batch amortizes the frozen
  350M-class VLM prefix over more samples. Keeping all three camera token slots
  but replacing only the two fully masked placeholder image encodes with
  same-shape zero embeddings removes two redundant frozen vision-encoder calls
  per optimizer step without changing sequence geometry or valid tokens.
