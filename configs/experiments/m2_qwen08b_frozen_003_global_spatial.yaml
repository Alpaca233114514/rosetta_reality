experiment_id: m2-qwen08b-frozen-003-global-spatial
hypothesis: >-
  Concatenating the frozen whole-sequence attention-masked mean with the verified
  image-token 2x2 spatial representation will preserve global instruction and
  scene context while retaining spatial variation, improving held-out action
  prediction and strict MuJoCo task success over the 001 and 002 references.
backbone:
  family: qwen35
  identifier: Qwen/Qwen3.5-0.8B-Base
  scale: 0.8B
  adaptation: frozen
  local_root_environment: ROSETTA_MODEL_ROOT
  manifest: model_manifest.json
  dtype: bfloat16
  feature_layer: final_hidden_state
  pooling: attention_masked_mean_plus_image_spatial_2x2
  processor:
    min_pixels: 100352
    max_pixels: 100352
    prompt_mode: base_multimodal
    prompt: "Execute the robot instruction safely: {instruction}"
dataset:
  config: configs/data/aloha_sim_insertion_m2.yaml
  frame_stride: 5
  split:
    seed: 20260809
    train: [49, 4, 23, 43, 21, 37, 18, 34, 0, 47, 38, 29, 3, 26, 14, 17, 44, 30, 15, 42, 10, 35, 25, 32, 19, 36, 41, 28, 8, 27, 16, 11, 2, 20, 9, 39, 46, 48, 12, 40]
    validation: [22, 13, 7, 33, 45]
    test: [31, 6, 1, 24, 5]
action_contract: configs/sim/aloha_insertion.yaml
action_expert:
  type: continuous_mlp
  output_projection: clip_to_action_contract
  state_hidden_dim: 256
  state_layers: 2
  state_dropout: 0.0
  fusion_dim: 256
  head_hidden_dim: 256
training:
  seed: 20260809
  optimizer_smoke_steps: 1
  batch_size: 64
  learning_rate: 0.0003
  weight_decay: 0.0001
  maximum_epochs: 40
  checkpoint_every_epochs: 5
  gradient_clip_norm: 1.0
  early_stopping_patience: 8
  overfit_samples: 32
  overfit_steps: 300
  overfit_maximum_loss_ratio: 0.20
benchmark:
  required_before_training: true
  baselines: [train_action_mean, current_state_persistence, deterministic_untrained_policy]
evaluation:
  primary_metric: action_mae
  compare_against: train_action_mean
  hidden_test_only_after_training: true
  invalid_action_tolerance: 0.0
simulation:
  gate1_steps_per_dimension: 5
  gate2_episode: 2
  gate2_seed: 10
  gate2_max_steps: 500
  gate3_steps: 20
  gate4_seeds: [1000, 1001, 1002, 1003, 1004]
  gate4_max_steps: 500
  minimum_task_success_rate: 0.2
  maximum_unexpected_collisions: 0
resources:
  runtime: docker_linux
  memory_limit: 5g
  memory_swap_limit: 5g
  cpu_limit: 2
  feature_batch_size: 1
  training_device: xpu
controlled_change:
  reference_experiments:
    - m2-qwen08b-frozen-001
    - m2-qwen08b-frozen-002-spatial
  changed_axis: backbone.pooling
  reference_values: [attention_masked_mean, image_spatial_2x2]
  candidate_value: attention_masked_mean_plus_image_spatial_2x2
  representation_order: [attention_masked_mean, image_spatial_2x2]
  execution_change:
    downstream_training_device: xpu
    rationale: user_authorized_intel_integrated_gpu_training
    cpu_reference_path_preserved: true
acceptance:
  validation_mae_below_reference: 0.0230362
  hidden_test_mae_below_reference: 0.0291032
  gate4_task_success_rate_at_least: 0.2
  gate4_raw_action_limit_violation_rate_at_most: 0.0
  gate4_joint_limit_violations_at_most: 0
  gate4_unexpected_collisions_at_most: 0
stop_conditions:
  - nonfinite_loss_or_action
  - action_contract_mismatch
  - dataset_or_model_identity_mismatch
  - combined_pooling_or_composition_contract_mismatch
  - xpu_unavailable
  - container_resource_limit
  - validation_does_not_improve_for_patience
