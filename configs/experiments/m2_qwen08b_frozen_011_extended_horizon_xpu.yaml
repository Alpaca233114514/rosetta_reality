experiment_id: m2-qwen08b-frozen-011-extended-horizon-xpu
experiment_role: extended_training_horizon_candidate
m2_completion_eligible: true
hypothesis: >-
  The v004 absolute spatial XPU reference reached its best validation result at
  the final configured epoch 40 and did not trigger early stopping. Extending
  only the maximum training horizon to 80 epochs, while retaining the same
  patience, seed, optimizer, model, data, loss, Action Contract, and runtime
  protocol, may continue the still-improving fit enough to reduce the executed
  first-action error without sacrificing raw action safety.
backbone:
  family: qwen35
  identifier: Qwen/Qwen3.5-0.8B-Base
  scale: 0.8B
  adaptation: frozen
  local_root_environment: ROSETTA_MODEL_ROOT
  manifest: model_manifest.json
  dtype: bfloat16
  feature_layer: final_hidden_state
  pooling: image_spatial_2x2
  processor:
    min_pixels: 100352
    max_pixels: 100352
    prompt_mode: base_multimodal
    prompt: "Execute the robot instruction safely: {instruction}"
dataset:
  config: configs/data/aloha_sim_insertion_m2.yaml
  frame_stride: 5
  split:
    seed: 20260809
    train: [49, 4, 23, 43, 21, 37, 18, 34, 0, 47, 38, 29, 3, 26, 14, 17, 44, 30, 15, 42, 10, 35, 25, 32, 19, 36, 41, 28, 8, 27, 16, 11, 2, 20, 9, 39, 46, 48, 12, 40]
    validation: [22, 13, 7, 33, 45]
    test: [31, 6, 1, 24, 5]
action_contract: configs/sim/aloha_insertion.yaml
action_expert:
  type: continuous_mlp
  output_projection: clip_to_action_contract
  prediction_parameterization: absolute
  state_hidden_dim: 256
  state_layers: 2
  state_dropout: 0.0
  fusion_dim: 256
  head_hidden_dim: 256
training:
  seed: 20260809
  optimizer_smoke_steps: 1
  batch_size: 64
  learning_rate: 0.0003
  weight_decay: 0.0001
  maximum_epochs: 80
  checkpoint_every_epochs: 5
  gradient_clip_norm: 1.0
  early_stopping_patience: 8
  overfit_samples: 32
  overfit_steps: 300
  overfit_maximum_loss_ratio: 0.20
benchmark:
  required_before_training: true
  baselines: [train_action_mean, current_state_persistence, deterministic_untrained_policy]
evaluation:
  primary_metric: action_mae
  compare_against: train_action_mean
  hidden_test_only_after_training: true
  test_use: reserved_until_validation_and_development_simulation_selection_pass
  invalid_action_tolerance: 0.0
simulation:
  gate1_steps_per_dimension: 5
  gate2_episode: 2
  gate2_seed: 10
  gate2_max_steps: 500
  gate3_steps: 20
  gate4_seeds: [1000, 1001, 1002, 1003, 1004]
  gate4_max_steps: 500
  minimum_task_success_rate: 0.2
  maximum_unexpected_collisions: 0
resources:
  runtime: docker_linux
  memory_limit: 5g
  memory_swap_limit: 5g
  cpu_limit: 2
  feature_batch_size: 1
  training_device: xpu
controlled_change:
  reference_experiment: m2-qwen08b-frozen-004-spatial-xpu-control
  changed_axis: training.maximum_epochs
  reference_value: 40
  candidate_value: 80
  validation_tuning_or_horizon_sweep: false
  all_other_model_data_training_and_runtime_axes_fixed: true
  feature_source_manifest: >-
    feature_cache/m2-qwen08b-frozen-004-spatial-xpu-control/bd3ee29d96a3da7a/manifest.json
  feature_derivation: verified_identity_rebind_v1
acceptance:
  reference_full_chunk_validation_mae: 0.0266666878
  full_chunk_validation_mae_at_most: 0.0261666878
  reference_first_action_validation_mae: 0.0224338565
  first_action_validation_mae_at_most: 0.0219338565
  reference_raw_action_limit_violation_rate: 0.0101911975
  raw_action_limit_violation_rate_at_most: 0.0101911975
  hidden_test_not_opened: true
  gate3_and_gate4_only_after_all_selection_conditions_pass: true
stop_conditions:
  - nonfinite_loss_or_action
  - action_contract_mismatch
  - dataset_or_model_identity_mismatch
  - derived_feature_tensor_mismatch
  - xpu_unavailable
  - container_resource_limit
  - overfit_loss_ratio_above_0.20
  - full_chunk_validation_mae_above_0.0261666878
  - first_action_validation_mae_above_0.0219338565
  - raw_action_limit_violation_rate_above_0.0101911975
