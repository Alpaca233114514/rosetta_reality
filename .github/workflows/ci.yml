name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/ci-smolvla.txt

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,sim]" -r requirements/ci-smolvla.txt

      - name: Install headless CPU rendering runtime
        run: |
          sudo apt-get update
          apt-cache policy libosmesa6 libgl1
          sudo apt-get install --yes --no-install-recommends libosmesa6 libgl1

      - name: Inspect environment
        run: python scripts/check_env.py

      - name: Lint
        run: ruff check .

      - name: Run offline tests
        env:
          HF_HUB_OFFLINE: "1"
          HF_DATASETS_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          MUJOCO_GL: osmesa
          PYOPENGL_PLATFORM: osmesa
        run: python -m pytest -m "not data"

      - name: Run dummy optimizer smoke
        run: python scripts/train.py --dry-run
