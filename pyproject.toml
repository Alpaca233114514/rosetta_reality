[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rosetta-reality"
version = "0.1.0"
description = "Backbone-agnostic Vision-Language-Action research foundations."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Rosetta Reality contributors" }]
dependencies = [
    "torch>=2.2",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]
data = [
    "lerobot[dataset]==0.6.1",
]
qwen = [
    "transformers>=5.2,<6",
    "peft>=0.18,<1",
]
sim = [
    "gym-aloha>=0.1.4,<0.2.0",
]
vla_tracking = [
    "trackio==0.28.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
markers = [
    "data: requires a locally prepared real dataset cache and never downloads data",
]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
